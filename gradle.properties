org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
# R8 compatibility (non-full) mode: full mode aggressively breaks Gson/Retrofit
# reflection in release builds (login/registration failed). Keep minify on but
# in the safer mode.
android.enableR8.fullMode=false
